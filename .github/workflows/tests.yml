name: Tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            requirements-constraints.txt
      - run: python -m pip install -r requirements-app.txt
      - run: python tools/run_tests.py
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-app.txt
      - run: node tests/web/post-state.test.js
      - run: node tests/web/setup-guide.test.js
      - run: node tests/web/settings-autosave.test.js
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/test_workflows.py
      - run: python tests/browser/test_social_web.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interface-failure
          path: test-artifacts/
