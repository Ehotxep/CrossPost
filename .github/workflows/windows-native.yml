name: Windows native prototype
on:
  push:
    branches: [windows-native]
    paths: ['native/**', '.github/workflows/windows-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: dotnet restore native/CrossPost.sln --locked-mode
      - name: Build C# and WPF
        run: dotnet build native/CrossPost.sln -c Release --no-restore
      - name: Check storage and Telegram contracts without sending
        run: dotnet run --project native/tests/CrossPost.SmokeTests -c Release --no-build
      - name: Publish standalone Windows application
        run: dotnet publish native/src/CrossPost.Desktop -c Release -r win-x64 --self-contained true --no-restore -o native/artifacts/win-x64
      - name: Start the actual WPF application in an isolated smoke test
        shell: pwsh
        run: |
          $env:CROSSPOST_NATIVE_DATA = Join-Path $env:RUNNER_TEMP ("CrossPostSmoke-" + [guid]::NewGuid())
          $process = Start-Process -FilePath (Resolve-Path native/artifacts/win-x64/CrossPost.Native.exe) -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw "WPF initialization timed out" }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "WPF initialization failed: $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $env:CROSSPOST_NATIVE_DATA "smoke-ready.txt"))) { throw "WPF readiness marker missing" }
      - name: Add usage instructions and create ZIP
        shell: pwsh
        run: |
          Copy-Item native/README.md native/artifacts/win-x64/README.md
          Compress-Archive -Path native/artifacts/win-x64/* -DestinationPath native/artifacts/CrossPost-Native-Prototype-0.1.0-win-x64.zip
          (Get-FileHash native/artifacts/CrossPost-Native-Prototype-0.1.0-win-x64.zip -Algorithm SHA256).Hash | Set-Content native/artifacts/CrossPost-Native-Prototype-0.1.0-win-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CrossPost-Native-Prototype-0.1.0-win-x64
          path: |
            native/artifacts/*.zip
            native/artifacts/*.sha256
          retention-days: 30
