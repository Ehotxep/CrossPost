name: Windows native prototype
on:
  push:
    branches: [windows-native]
    tags: ['native-v*']
    paths: ['native/**', '.github/workflows/windows-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: native/global.json
      - name: Read native version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/CrossPost.Desktop/CrossPost.Desktop.csproj
          "version=$($project.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT
      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet --version
          $output = & dotnet restore CrossPost.sln --locked-mode 2>&1
          $result = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($result -ne 0) {
            $output | Where-Object { $_ -match 'error|NU[0-9]{4}' } | ForEach-Object { Write-Output "::error::$_" }
            exit $result
          }
      - name: Build C# and WPF
        run: dotnet build CrossPost.sln -c Release --no-restore
      - name: Check storage and Telegram contracts without sending
        shell: pwsh
        run: |
          $output = & dotnet run --project tests/CrossPost.SmokeTests -c Release --no-build 2>&1
          $result = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($result -ne 0) {
            $output | Where-Object { $_ -match '^FAIL' } | ForEach-Object {
              $message = ([string]$_).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error::$message"
            }
            exit $result
          }
      - name: Publish standalone Windows application
        run: dotnet publish src/CrossPost.Desktop -c Release -r win-x64 --self-contained true --no-restore -o artifacts/win-x64
      - name: Publish independent updater and package files
        shell: pwsh
        run: |
          dotnet publish src/CrossPost.Updater -c Release -r win-x64 --self-contained true --no-restore -o artifacts/updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/updater/CrossPost.Updater.exe artifacts/win-x64/CrossPost.Updater.exe
          Copy-Item README.md artifacts/win-x64/README.md
          ./tools/Package.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Verify actual WPF layout and single-request close in an isolated test
        shell: pwsh
        run: |
          try {
          $env:CROSSPOST_NATIVE_DATA = Join-Path $env:RUNNER_TEMP ("CrossPostSmoke-" + [guid]::NewGuid())
          $process = Start-Process -FilePath (Resolve-Path artifacts/win-x64/CrossPost.Native.exe) -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(45000)) { $process.Kill(); throw "WPF initialization timed out" }
          $process.Refresh()
          if (Test-Path (Join-Path $env:CROSSPOST_NATIVE_DATA "error.log")) { Get-Content (Join-Path $env:CROSSPOST_NATIVE_DATA "error.log") }
          if ($process.ExitCode -ne 0) {
            Get-ChildItem $env:CROSSPOST_NATIVE_DATA -Filter "*error.log" | ForEach-Object {
              $message = (Get-Content $_.FullName -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error::$message"
            }
            throw "WPF initialization failed: $($process.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $env:CROSSPOST_NATIVE_DATA "smoke-ready.txt"))) { throw "WPF readiness marker missing" }
          if (-not (Test-Path (Join-Path $env:CROSSPOST_NATIVE_DATA "close-smoke-ready.txt"))) { throw "Window did not confirm normal single-request close" }
          if (-not (Test-Path (Join-Path $env:CROSSPOST_NATIVE_DATA "migration-smoke-ready.txt"))) { throw "Python profile migration and DPAPI check missing" }
          Set-Content (Join-Path $env:CROSSPOST_NATIVE_DATA "window-closed.txt") "Window process exited"
          $verify = Start-Process -FilePath (Resolve-Path artifacts/win-x64/CrossPost.Native.exe) -ArgumentList "--verify-worker-smoke" -PassThru
          if (-not $verify.WaitForExit(90000)) { $verify.Kill(); throw "Background worker test timed out" }
          $verify.Refresh()
          Get-ChildItem $env:CROSSPOST_NATIVE_DATA -Filter "*error.log" | ForEach-Object { Get-Content $_.FullName }
          if ($verify.ExitCode -ne 0) {
            Get-ChildItem $env:CROSSPOST_NATIVE_DATA -Filter "*error.log" | ForEach-Object {
              $message = (Get-Content $_.FullName -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error::$message"
            }
            throw "Worker scheduling/IPC/restart test failed: $($verify.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $env:CROSSPOST_NATIVE_DATA "worker-smoke-ready.txt"))) { throw "Worker readiness marker missing" }
          } catch {
            $stages = Join-Path $env:CROSSPOST_NATIVE_DATA "smoke-stage.log"
            if (Test-Path $stages) {
              $trace = (Get-Content $stages -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::notice::$trace"
            }
            $message = $_.Exception.ToString().Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$message"
            throw
          } finally {
            $screens = Join-Path $env:CROSSPOST_NATIVE_DATA "screenshots"
            if (Test-Path $screens) {
              New-Item -ItemType Directory -Force artifacts/ui-screenshots | Out-Null
              Copy-Item (Join-Path $screens "*.png") artifacts/ui-screenshots/
            }
          }
      - name: Verify actual Windows updater success and failed-start rollback
        shell: pwsh
        run: |
          $env:CROSSPOST_NATIVE_DATA = Join-Path $env:RUNNER_TEMP ("CrossPostUpdateSmoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $env:CROSSPOST_NATIVE_DATA | Out-Null
          $archive = (Resolve-Path "artifacts/CrossPost-Native-Prototype-${{ steps.version.outputs.version }}-win-x64.zip").Path
          $process = Start-Process -FilePath (Resolve-Path artifacts/win-x64/CrossPost.Native.exe) -ArgumentList "--verify-update-smoke", $archive -PassThru
          if (-not $process.WaitForExit(330000)) { $process.Kill(); throw "Windows updater lifecycle timed out" }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            Get-ChildItem $env:CROSSPOST_NATIVE_DATA -Filter '*error.log' | ForEach-Object {
              $message = (Get-Content $_.FullName -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error::$message"
            }
            throw "Windows updater failed: $($process.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $env:CROSSPOST_NATIVE_DATA 'update-smoke-ready.txt'))) { throw "Update readiness missing" }
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('native/artifacts/ui-screenshots/*.png') != ''
        with:
          name: CrossPost-Native-UI-${{ steps.version.outputs.version }}-win-x64
          path: native/artifacts/ui-screenshots/*.png
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: CrossPost-Native-Prototype-${{ steps.version.outputs.version }}-win-x64
          path: |
            native/artifacts/*.zip
            native/artifacts/*.sha256
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CrossPost-Native-Prototype-${{ needs.build.outputs.version }}-win-x64
          path: native-release
      - name: Publish tagged native version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ needs.build.outputs.version }}'
          test "$GITHUB_REF_NAME" = "native-v$version"
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" native-release/*.zip native-release/*.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" --latest=false --title "CrossPost Native $version" --notes-file native/RELEASE-NOTES.md
